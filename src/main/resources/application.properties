# app config
spring.application.name=personal-finance-manager
server.port=${PORT:8080}

# session timeout - 30 min is enough for testing
server.servlet.session.timeout=30m

spring.datasource.url=jdbc:h2:mem:finance_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-bigdecimal-as-plain=true
